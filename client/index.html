<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ciudades | JS Flights</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <h1>Vuelo</h1>
      <div class="city-field">
        <label for="origin-city-select">Ciudad de origen</label>
        <select id="origin-city-select" name="origin" disabled>
          <option value="">Cargando ciudades...</option>
        </select>
      </div>
      <div class="city-field">
        <label for="destination-city-select">Ciudad de destino</label>
        <select id="destination-city-select" name="destination" disabled>
          <option value="">Cargando ciudades...</option>
        </select>
      </div>
      <p id="status" role="status" aria-live="polite"></p>
    </main>
    <script type="module" src="./dist/index.js"></script>
  </body>
</html>
